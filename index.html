<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigitaHinos – Aplicativos de hinos</title>
<meta name="description" content="DigitaHinos: aplicativos para tocar e estudar hinos em vários instrumentos.">
<style>
  :root { --bg:#fbf6ec; --card:#fffaf0; --text:#2b2113; --muted:#6b5a43; --accent:#b8741a; --border:#e6d8bd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16110a; --card:#211a10; --text:#f3e9d6; --muted:#bfae92; --accent:#e0a043; --border:#3a2e1c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px; }
  main { max-width:520px; width:100%; background:var(--card); border:1px solid var(--border);
         border-radius:20px; padding:32px 24px; text-align:center; }
  h1 { margin:0 0 8px; font-size:1.8rem; color:var(--accent); }
  p { margin:0 0 20px; line-height:1.5; color:var(--muted); }
  a.btn { display:inline-block; padding:14px 22px; border-radius:14px; background:var(--accent);
          color:#1b1206; font-weight:700; text-decoration:none; }
  small { display:block; margin-top:24px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>DigitaHinos</h1>
  <p>Aplicativos para tocar e estudar hinos em vários instrumentos, com partitura animada.</p>
  <a class="btn" href="https://capuchowp-design.github.io/DigitaHinos-Plataforma/">Ver todos os aplicativos</a>
  <small>Desenvolvedor: wpcapucho</small>
</main>
</body>
</html>
